<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#0e0e10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Finanças</title>
<style>
  :root{
    --bg:#0e0e10;
    --surface:#17171a;
    --surface-2:#1f1f24;
    --line:#2a2a30;
    --txt:#f4f4f5;
    --txt-dim:#8a8a93;
    --accent:#d4a574;
    --accent-soft:#2a2118;
    --green:#5fb87a;
    --red:#d56b6b;
    --safe-top:env(safe-area-inset-top);
    --safe-bot:env(safe-area-inset-bottom);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:'SF Pro Text',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:16px;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(120% 80% at 50% 0%, #1c1812 0%, transparent 55%);
  }
  #app{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;
    padding-top:calc(var(--safe-top) + 14px);
    padding-bottom:calc(var(--safe-bot) + 90px);
    min-height:100%;
  }
  header{
    padding:0 22px 18px;
  }
  header .greeting{font-size:13px;color:var(--txt-dim);letter-spacing:.04em;text-transform:uppercase;}
  header h1{
    font-family:'SF Pro Display',-apple-system,sans-serif;
    font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:3px;
  }
  /* ---- Tabs ---- */
  .tabs{
    display:flex;gap:6px;margin:0 18px 20px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:5px;
  }
  .tab{
    flex:1;text-align:center;padding:10px 0;border-radius:10px;
    font-size:14px;font-weight:600;color:var(--txt-dim);
    transition:.18s;cursor:pointer;
  }
  .tab.active{background:var(--accent-soft);color:var(--accent);}
  /* ---- Cards ---- */
  .view{display:none;padding:0 18px;animation:fade .25s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .balance-card{
    background:linear-gradient(150deg,var(--surface-2),var(--surface));
    border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;
  }
  .balance-card .label{font-size:12px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.06em;}
  .balance-card .amount{
    font-family:'SF Pro Display',sans-serif;
    font-size:38px;font-weight:700;margin-top:6px;letter-spacing:-.02em;
  }
  .balance-card .sub{display:flex;gap:18px;margin-top:14px;font-size:13px;}
  .balance-card .sub b{display:block;font-size:16px;font-weight:600;margin-top:2px;}
  .pos{color:var(--green);}
  .neg{color:var(--red);}
  .section-title{
    font-size:13px;color:var(--txt-dim);text-transform:uppercase;
    letter-spacing:.06em;margin:22px 4px 10px;font-weight:600;
  }
  /* ---- List items ---- */
  .item{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;margin-bottom:8px;
  }
  .item .ic{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;
    background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:17px;
  }
  .item .meta{flex:1;min-width:0;}
  .item .meta .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .meta .d{font-size:12px;color:var(--txt-dim);margin-top:2px;}
  .item .val{font-size:15px;font-weight:700;white-space:nowrap;}
  .item .del{
    color:var(--txt-dim);font-size:18px;padding:4px 2px 4px 10px;cursor:pointer;
  }
  .empty{
    text-align:center;color:var(--txt-dim);font-size:14px;
    padding:38px 20px;border:1px dashed var(--line);border-radius:16px;
  }
  /* ---- Category bars ---- */
  .cat{margin-bottom:12px;}
  .cat .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .cat .bar{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .cat .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;}
  /* ---- Floating add button ---- */
  .fab{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(var(--safe-bot) + 20px);z-index:20;
    background:var(--accent);color:#1a140b;
    font-size:15px;font-weight:700;
    padding:15px 30px;border:none;border-radius:30px;
    box-shadow:0 8px 28px rgba(212,165,116,.35);cursor:pointer;
  }
  /* ---- Modal ---- */
  .modal{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  }
  .modal.show{display:flex;}
  .sheet{
    width:100%;max-width:560px;
    background:var(--surface);border-radius:24px 24px 0 0;
    border-top:1px solid var(--line);
    padding:22px 22px calc(var(--safe-bot) + 26px);
    animation:slideup .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideup{from{transform:translateY(100%);}to{transform:none;}}
  .sheet h2{font-size:19px;font-weight:700;margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--txt-dim);
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .field input,.field select{
    width:100%;background:var(--surface-2);border:1px solid var(--line);
    color:var(--txt);font-size:16px;padding:13px 14px;border-radius:12px;
    font-family:inherit;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .seg{display:flex;gap:8px;margin-bottom:14px;}
  .seg button{
    flex:1;padding:11px 0;border-radius:11px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--txt-dim);font-weight:600;
    font-size:14px;cursor:pointer;font-family:inherit;
  }
  .seg button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .btn-primary{
    width:100%;background:var(--accent);color:#1a140b;
    font-size:16px;font-weight:700;padding:15px;border:none;
    border-radius:14px;margin-top:6px;cursor:pointer;font-family:inherit;
  }
  .btn-ghost{
    width:100%;background:transparent;color:var(--txt-dim);
    font-size:14px;padding:12px;border:none;cursor:pointer;
    margin-top:4px;font-family:inherit;
  }
  /* ---- Tools row ---- */
  .tools{display:flex;gap:8px;margin:18px 0 6px;}
  .tools button{
    flex:1;background:var(--surface);border:1px solid var(--line);
    color:var(--txt);font-size:13px;font-weight:600;padding:12px;
    border-radius:12px;cursor:pointer;font-family:inherit;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="greeting" id="dateLine"></div>
    <h1>As minhas finanças</h1>
  </header>

  <div class="tabs">
    <div class="tab active" data-view="dia">Dia a Dia</div>
    <div class="tab" data-view="vendas">Vendas Roupa</div>
  </div>

  <!-- ============ VIEW: DIA A DIA ============ -->
  <section class="view active" id="view-dia">
    <div class="balance-card">
      <div class="label">Saldo do período</div>
      <div class="amount" id="diaSaldo">0,00 €</div>
      <div class="sub">
        <div><span class="txt-dim" style="color:var(--txt-dim);font-size:12px;">Entradas</span>
          <b class="pos" id="diaIn">0,00 €</b></div>
        <div><span style="color:var(--txt-dim);font-size:12px;">Saídas</span>
          <b class="neg" id="diaOut">0,00 €</b></div>
      </div>
    </div>

    <div class="section-title">Por categoria</div>
    <div id="diaCats"></div>

    <div class="section-title">Movimentos</div>
    <div id="diaList"></div>
  </section>

  <!-- ============ VIEW: VENDAS ============ -->
  <section class="view" id="view-vendas">
    <div class="balance-card">
      <div class="label">Total de vendas</div>
      <div class="amount" id="vTotal">0,00 €</div>
      <div class="sub">
        <div><span style="color:var(--txt-dim);font-size:12px;">Nº vendas</span>
          <b id="vCount">0</b></div>
        <div><span style="color:var(--txt-dim);font-size:12px;">Lucro estimado</span>
          <b class="pos" id="vLucro">0,00 €</b></div>
      </div>
    </div>

    <div class="tools">
      <button id="btnExport">⬇ Exportar Excel</button>
      <button id="btnImport">⬆ Importar Excel</button>
      <input type="file" id="fileIn" accept=".xlsx,.xls,.csv" hidden>
    </div>

    <div class="section-title">Registo de vendas</div>
    <div id="vList"></div>
  </section>
</div>

<button class="fab" id="fab">+ Adicionar</button>

<!-- ============ MODAL: DIA ============ -->
<div class="modal" id="modalDia">
  <div class="sheet">
    <h2>Novo movimento</h2>
    <div class="seg">
      <button class="on" data-k="out" id="segOut">Despesa</button>
      <button data-k="in" id="segIn">Entrada</button>
    </div>
    <div class="field">
      <label>Descrição</label>
      <input id="dDesc" placeholder="Ex: Almoço, Salário…">
    </div>
    <div class="field">
      <label>Valor (€)</label>
      <input id="dVal" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
    </div>
    <div class="field">
      <label>Categoria</label>
      <select id="dCat">
        <option>Alimentação</option><option>Transporte</option>
        <option>Casa</option><option>Lazer</option>
        <option>Saúde</option><option>Compras</option>
        <option>Salário</option><option>Outro</option>
      </select>
    </div>
    <div class="field">
      <label>Data</label>
      <input id="dDate" type="date">
    </div>
    <button class="btn-primary" id="saveDia">Guardar</button>
    <button class="btn-ghost" data-close>Cancelar</button>
  </div>
</div>

<!-- ============ MODAL: VENDA ============ -->
<div class="modal" id="modalVenda">
  <div class="sheet">
    <h2>Nova venda</h2>
    <div class="field">
      <label>Peça / artigo</label>
      <input id="vArt" placeholder="Ex: Casaco Nike">
    </div>
    <div class="field">
      <label>Preço de venda (€)</label>
      <input id="vPV" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
    </div>
    <div class="field">
      <label>Custo / compra (€) — opcional</label>
      <input id="vPC" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
    </div>
    <div class="field">
      <label>Plataforma</label>
      <select id="vPlat">
        <option>Vinted</option><option>OLX</option>
        <option>Instagram</option><option>Pessoalmente</option>
        <option>Outro</option>
      </select>
    </div>
    <div class="field">
      <label>Data</label>
      <input id="vDate" type="date">
    </div>
    <button class="btn-primary" id="saveVenda">Guardar</button>
    <button class="btn-ghost" data-close>Cancelar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const DB={
  dia:JSON.parse(localStorage.getItem('fin_dia')||'[]'),
  vendas:JSON.parse(localStorage.getItem('fin_vendas')||'[]')
};
const save=()=>{
  localStorage.setItem('fin_dia',JSON.stringify(DB.dia));
  localStorage.setItem('fin_vendas',JSON.stringify(DB.vendas));
};
const eur=n=>n.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=s=>{const[y,m,d]=s.split('-');return `${d}/${m}/${y}`;};

// date line
document.getElementById('dateLine').textContent=
  new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});

// ---- Tabs ----
let view='dia';
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  view=t.dataset.view;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
});

// ---- Render: Dia ----
function renderDia(){
  const inc=DB.dia.filter(x=>x.k==='in').reduce((s,x)=>s+x.v,0);
  const out=DB.dia.filter(x=>x.k==='out').reduce((s,x)=>s+x.v,0);
  document.getElementById('diaIn').textContent=eur(inc);
  document.getElementById('diaOut').textContent=eur(out);
  const sal=inc-out;
  const se=document.getElementById('diaSaldo');
  se.textContent=eur(sal);se.className='amount '+(sal>=0?'pos':'neg');

  // categories (despesas)
  const cats={};
  DB.dia.filter(x=>x.k==='out').forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.v);
  const cw=document.getElementById('diaCats');
  const entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){cw.innerHTML='<div class="empty">Sem despesas registadas</div>';}
  else{
    cw.innerHTML=entries.map(([c,v])=>{
      const pct=out?Math.round(v/out*100):0;
      return `<div class="cat"><div class="row"><span>${c}</span>
        <span>${eur(v)} · ${pct}%</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div></div>`;
    }).join('');
  }

  // list
  const lw=document.getElementById('diaList');
  if(!DB.dia.length){lw.innerHTML='<div class="empty">Toca em “Adicionar” para registar um movimento</div>';return;}
  lw.innerHTML=[...DB.dia].reverse().map((x,ri)=>{
    const i=DB.dia.length-1-ri;
    const sign=x.k==='in'?'+':'−';
    return `<div class="item">
      <div class="ic">${x.k==='in'?'↑':'↓'}</div>
      <div class="meta"><div class="t">${esc(x.desc)}</div>
        <div class="d">${x.cat} · ${fmtD(x.date)}</div></div>
      <div class="val ${x.k==='in'?'pos':'neg'}">${sign}${eur(x.v)}</div>
      <div class="del" data-d="dia" data-i="${i}">✕</div>
    </div>`;
  }).join('');
}

// ---- Render: Vendas ----
function renderVendas(){
  const tot=DB.vendas.reduce((s,x)=>s+x.pv,0);
  const lucro=DB.vendas.reduce((s,x)=>s+(x.pv-(x.pc||0)),0);
  document.getElementById('vTotal').textContent=eur(tot);
  document.getElementById('vCount').textContent=DB.vendas.length;
  document.getElementById('vLucro').textContent=eur(lucro);

  const lw=document.getElementById('vList');
  if(!DB.vendas.length){lw.innerHTML='<div class="empty">Sem vendas registadas</div>';return;}
  lw.innerHTML=[...DB.vendas].reverse().map((x,ri)=>{
    const i=DB.vendas.length-1-ri;
    const luc=x.pv-(x.pc||0);
    return `<div class="item">
      <div class="ic">€</div>
      <div class="meta"><div class="t">${esc(x.art)}</div>
        <div class="d">${x.plat} · ${fmtD(x.date)} · lucro ${eur(luc)}</div></div>
      <div class="val pos">${eur(x.pv)}</div>
      <div class="del" data-d="vendas" data-i="${i}">✕</div>
    </div>`;
  }).join('');
}
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function renderAll(){renderDia();renderVendas();}

// ---- Delete (event delegation) ----
document.body.addEventListener('click',e=>{
  const d=e.target.closest('.del');
  if(!d)return;
  if(confirm('Eliminar este registo?')){
    DB[d.dataset.d].splice(+d.dataset.i,1);save();renderAll();
  }
});

// ---- Modals ----
const mDia=document.getElementById('modalDia');
const mVen=document.getElementById('modalVenda');
function openModal(){
  if(view==='dia'){document.getElementById('dDate').value=today();mDia.classList.add('show');}
  else{document.getElementById('vDate').value=today();mVen.classList.add('show');}
}
document.getElementById('fab').onclick=openModal;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{
  mDia.classList.remove('show');mVen.classList.remove('show');
});
[mDia,mVen].forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('show');});

// segment in/out
let curK='out';
document.getElementById('segOut').onclick=()=>setSeg('out');
document.getElementById('segIn').onclick=()=>setSeg('in');
function setSeg(k){curK=k;
  document.getElementById('segOut').classList.toggle('on',k==='out');
  document.getElementById('segIn').classList.toggle('on',k==='in');
}

// save dia
document.getElementById('saveDia').onclick=()=>{
  const desc=document.getElementById('dDesc').value.trim();
  const v=parseFloat(document.getElementById('dVal').value);
  if(!desc||!(v>0)){alert('Preenche a descrição e um valor válido.');return;}
  DB.dia.push({k:curK,desc,v,cat:document.getElementById('dCat').value,
    date:document.getElementById('dDate').value||today()});
  save();renderAll();
  document.getElementById('dDesc').value='';document.getElementById('dVal').value='';
  mDia.classList.remove('show');
};
// save venda
document.getElementById('saveVenda').onclick=()=>{
  const art=document.getElementById('vArt').value.trim();
  const pv=parseFloat(document.getElementById('vPV').value);
  const pc=parseFloat(document.getElementById('vPC').value)||0;
  if(!art||!(pv>0)){alert('Preenche o artigo e o preço de venda.');return;}
  DB.vendas.push({art,pv,pc,plat:document.getElementById('vPlat').value,
    date:document.getElementById('vDate').value||today()});
  save();renderAll();
  document.getElementById('vArt').value='';document.getElementById('vPV').value='';
  document.getElementById('vPC').value='';
  mVen.classList.remove('show');
};

// ---- Excel export ----
document.getElementById('btnExport').onclick=()=>{
  if(!DB.vendas.length){alert('Não há vendas para exportar.');return;}
  const rows=DB.vendas.map(x=>({
    Data:x.date,Artigo:x.art,'Preço Venda':x.pv,
    'Custo':x.pc||0,'Lucro':x.pv-(x.pc||0),Plataforma:x.plat
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Vendas');
  XLSX.writeFile(wb,`vendas_${today()}.xlsx`);
};
// ---- Excel import ----
document.getElementById('btnImport').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const sh=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sh);
      let n=0;
      rows.forEach(rr=>{
        const art=rr.Artigo||rr.artigo||rr.Peça||rr.Peca;
        const pv=parseFloat(rr['Preço Venda']||rr['Preco Venda']||rr.PV||rr.Preço||0);
        if(art&&pv>0){
          DB.vendas.push({
            art:String(art),pv,
            pc:parseFloat(rr.Custo||rr.custo||0)||0,
            plat:String(rr.Plataforma||rr.plataforma||'Outro'),
            date:String(rr.Data||rr.data||today()).slice(0,10)
          });n++;
        }
      });
      save();renderAll();
      alert(n?`${n} vendas importadas.`:'Nenhuma linha válida encontrada. Verifica os nomes das colunas (Artigo, Preço Venda).');
    }catch(err){alert('Erro a ler o ficheiro: '+err.message);}
    e.target.value='';
  };
  r.readAsBinaryString(f);
};

renderAll();

// register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
